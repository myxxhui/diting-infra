{{- if and .Values.copilot.enabled .Values.copilot.executingT0Jobs.enabled .Values.copilot.executingT0Jobs.bootstrapHook }}
apiVersion: batch/v1
kind: Job
metadata:
  name: executing-t0-bootstrap-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: executing-t0
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  template:
    spec:
      {{- include "diting.executingT0JobPod" (list . (dict "id" "bootstrap-sync")) | nindent 6 }}
{{- end }}
