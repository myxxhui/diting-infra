{{- if and .Values.copilot.enabled .Values.copilot.radarT0Jobs.enabled .Values.copilot.radarT0Jobs.bootstrapHook }}
apiVersion: batch/v1
kind: Job
metadata:
  name: radar-t0-bootstrap-sync-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: radar-t0-bootstrap
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: diting
        component: radar-t0-bootstrap
    spec:
      restartPolicy: Never
      {{- include "diting.radarT0JobPod" (list . "bootstrap-sync" 3600) | nindent 6 }}
{{- end }}
