{{- if .Values.copilot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diting-copilot
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: copilot
spec:
  replicas: {{ .Values.copilot.replicas }}
  selector:
    matchLabels:
      app: diting
      component: copilot
  template:
    metadata:
      labels:
        app: diting
        component: copilot
        diting.io/copilot-image-tag: {{ .Values.copilot.image.tag | quote }}
      annotations:
        diting.io/copilot-image-tag: {{ .Values.copilot.image.tag | quote }}
        diting.io/copilot-image-repository: {{ .Values.copilot.image.repository | quote }}
    spec:
      {{- with .Values.copilot.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
      - name: {{ if kindIs "string" . }}{{ . | quote }}{{ else }}{{ .name | default "" | quote }}{{ end }}
      {{- end }}
      {{- end }}
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "等待 Redis..."
          until nc -z {{ .Values.copilot.redisHost }} {{ .Values.copilot.redisPort }}; do sleep 2; done
          echo "Redis 就绪"
      {{- if .Values.copilot.postgres.enabled }}
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "等待 PostgreSQL {{ .Values.copilot.postgres.host }}..."
          until nc -z {{ .Values.copilot.postgres.host }} {{ .Values.copilot.postgres.port }}; do sleep 2; done
          echo "PostgreSQL 端口就绪"
      {{- end }}
      containers:
      - name: copilot
        image: "{{ .Values.copilot.image.repository }}:{{ .Values.copilot.image.tag }}"
        imagePullPolicy: {{ .Values.copilot.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: diting-copilot-conn
        env:
        - name: COPILOT_PORT
          value: "8080"
        - name: COPILOT_ALERT_CONSUMER_ENABLED
          value: {{ .Values.copilot.alertConsumerEnabled | quote }}
        - name: COPILOT_LEDGER_SCHEDULER_ENABLED
          value: {{ .Values.copilot.ledgerSchedulerEnabled | quote }}
        - name: RADAR_T0_CACHE_DIR
          value: {{ .Values.copilot.radarT0CacheDir | default "/data/radar_t0_cache" | quote }}
        - name: RADAR_T0_CACHE_MAX_AGE_HOURS
          value: {{ .Values.copilot.radarT0CacheMaxAgeHours | default "24" | quote }}
        - name: RADAR_T0_RETENTION_DAYS
          value: {{ .Values.copilot.radarT0RetentionDays | default "1" | quote }}
        - name: RADAR_FILE_RETENTION_HOURS
          value: {{ .Values.copilot.radarFileRetentionHours | default "24" | quote }}
        - name: RADAR_DB_RETENTION_DAYS
          value: {{ .Values.copilot.radarDbRetentionDays | default "30" | quote }}
        - name: RADAR_DB_MAX_VERSIONS
          value: {{ .Values.copilot.radarDbMaxVersions | default "7" | quote }}
        - name: RADAR_RECENT_ANALYSIS_DAYS
          value: {{ .Values.copilot.radarRecentAnalysisDays | default "7" | quote }}
        - name: RADAR_CHAT_DEFAULT_MODEL
          value: {{ .Values.copilot.radarChatDefaultModel | default "claude-opus-4-6" | quote }}
        - name: RADAR_T0_LIVE_FALLBACK
          value: {{ .Values.copilot.radarT0LiveFallback | default "false" | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 25
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        {{- if .Values.storage.radarT0Cache.enabled }}
        - name: radar-t0-cache
          mountPath: /data/radar_t0_cache
        {{- end }}
        {{- if .Values.storage.copilotReports.enabled }}
        - name: copilot-reports
          mountPath: /data/reports
        {{- else if not .Values.storage.radarT0Cache.enabled }}
        - name: copilot-data
          mountPath: /data
        {{- end }}
        {{- if and .Values.storage.radarT0Cache.enabled (not .Values.storage.copilotReports.enabled) }}
        - name: copilot-reports-empty
          mountPath: /data/reports
        {{- end }}
        {{- if .Values.copilot.holdingsYaml }}
        - name: holdings-config
          mountPath: /config
          readOnly: true
        {{- end }}
        {{- with .Values.copilot.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      {{- if .Values.storage.radarT0Cache.enabled }}
      - name: radar-t0-cache
        persistentVolumeClaim:
          claimName: {{ .Values.storage.radarT0Cache.pvc.name }}
      {{- end }}
      {{- if .Values.storage.copilotReports.enabled }}
      - name: copilot-reports
        persistentVolumeClaim:
          claimName: {{ .Values.storage.copilotReports.pvc.name }}
      {{- else if .Values.storage.radarT0Cache.enabled }}
      - name: copilot-reports-empty
        emptyDir: {}
      {{- else }}
      - name: copilot-data
        {{- if .Values.copilot.persistence.enabled }}
        persistentVolumeClaim:
          claimName: diting-copilot-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
      {{- if .Values.copilot.holdingsYaml }}
      - name: holdings-config
        secret:
          secretName: diting-copilot-holdings
      {{- end }}
      {{- with .Values.copilot.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
