{{- if .Values.copilot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diting-copilot
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: copilot
spec:
  replicas: {{ .Values.copilot.replicas }}
  selector:
    matchLabels:
      app: diting
      component: copilot
  template:
    metadata:
      labels:
        app: diting
        component: copilot
    spec:
      {{- with .Values.copilot.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
      - name: {{ if kindIs "string" . }}{{ . | quote }}{{ else }}{{ .name | default "" | quote }}{{ end }}
      {{- end }}
      {{- end }}
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "等待 Redis..."
          until nc -z {{ .Values.copilot.redisHost }} {{ .Values.copilot.redisPort }}; do sleep 2; done
          echo "Redis 就绪"
      containers:
      - name: copilot
        image: "{{ .Values.copilot.image.repository }}:{{ .Values.copilot.image.tag }}"
        imagePullPolicy: {{ .Values.copilot.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: diting-copilot-conn
        env:
        - name: COPILOT_PORT
          value: "8080"
        - name: COPILOT_ALERT_CONSUMER_ENABLED
          value: {{ .Values.copilot.alertConsumerEnabled | quote }}
        - name: COPILOT_LEDGER_SCHEDULER_ENABLED
          value: {{ .Values.copilot.ledgerSchedulerEnabled | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 25
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: copilot-data
          mountPath: /data
        {{- if .Values.copilot.holdingsYaml }}
        - name: holdings-config
          mountPath: /config
          readOnly: true
        {{- end }}
        {{- with .Values.copilot.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: copilot-data
        {{- if .Values.copilot.persistence.enabled }}
        persistentVolumeClaim:
          claimName: diting-copilot-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.copilot.holdingsYaml }}
      - name: holdings-config
        secret:
          secretName: diting-copilot-holdings
      {{- end }}
      {{- with .Values.copilot.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
