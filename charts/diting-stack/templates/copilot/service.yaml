{{- if .Values.copilot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: diting-copilot
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: copilot
spec:
  type: {{ .Values.copilot.service.type }}
  selector:
    app: diting
    component: copilot
  ports:
  - name: http
    port: 8080
    targetPort: http
    {{- if and (eq .Values.copilot.service.type "NodePort") .Values.copilot.service.nodePort }}
    nodePort: {{ .Values.copilot.service.nodePort }}
    {{- end }}
{{- end }}
