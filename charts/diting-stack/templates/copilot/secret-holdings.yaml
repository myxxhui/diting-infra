{{- if and .Values.copilot.enabled .Values.copilot.holdingsYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: diting-copilot-holdings
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: copilot
type: Opaque
stringData:
  my_holdings.yaml: |
{{ .Values.copilot.holdingsYaml | nindent 4 }}
{{- end }}
