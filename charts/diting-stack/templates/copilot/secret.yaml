{{- if .Values.copilot.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: diting-copilot-conn
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: copilot
type: Opaque
stringData:
  COPILOT_REDIS_URL: "redis://{{ .Values.copilot.redisHost }}:{{ .Values.copilot.redisPort }}/{{ .Values.copilot.redisDb }}"
  COPILOT_DB_URL: {{ .Values.copilot.dbUrl | quote }}
  MY_HOLDINGS_YAML: "/config/my_holdings.yaml"
  {{- if .Values.copilot.smtp.enabled }}
  COPILOT_SMTP_HOST: {{ .Values.copilot.smtp.host | quote }}
  COPILOT_SMTP_PORT: {{ .Values.copilot.smtp.port | quote }}
  COPILOT_SMTP_USE_SSL: {{ .Values.copilot.smtp.useSsl | quote }}
  COPILOT_SMTP_USERNAME: {{ .Values.copilot.smtp.username | quote }}
  COPILOT_SMTP_PASSWORD: {{ .Values.copilot.smtp.password | quote }}
  COPILOT_SMTP_FROM: {{ .Values.copilot.smtp.from | quote }}
  COPILOT_SMTP_TO: {{ .Values.copilot.smtp.to | quote }}
  {{- end }}
{{- end }}
