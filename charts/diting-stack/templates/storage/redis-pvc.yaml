{{- if .Values.storage.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.redis.pvc.name }}
  namespace: {{ .Values.storage.redis.pvc.namespace | default .Release.Namespace }}
  labels:
    app: diting
    component: redis
    type: static-storage
spec:
  accessModes:
    - {{ .Values.storage.redis.pvc.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.redis.pvc.storageRequest }}
  storageClassName: ""
  volumeName: {{ .Values.storage.redis.pv.name }}
{{- end }}
