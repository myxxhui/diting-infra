{{- if .Values.opensearch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diting-opensearch
  namespace: {{ .Release.Namespace }}
  labels:
    app: diting
    component: opensearch
spec:
  replicas: {{ .Values.opensearch.replicas }}
  selector:
    matchLabels:
      app: diting
      component: opensearch
  template:
    metadata:
      labels:
        app: diting
        component: opensearch
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: fix-data-perms
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          chown -R 1000:1000 /usr/share/opensearch/data || true
          chmod -R 775 /usr/share/opensearch/data || true
        volumeMounts:
        - name: data
          mountPath: /usr/share/opensearch/data
      containers:
      - name: opensearch
        image: "{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
        imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 9200
        env:
        - name: discovery.type
          value: single-node
        - name: DISABLE_SECURITY_PLUGIN
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: {{ .Values.opensearch.javaOpts | quote }}
        - name: bootstrap.memory_lock
          value: "false"
        volumeMounts:
        - name: data
          mountPath: /usr/share/opensearch/data
        resources:
          {{- toYaml .Values.opensearch.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.storage.opensearch.pvc.name }}
{{- end }}
