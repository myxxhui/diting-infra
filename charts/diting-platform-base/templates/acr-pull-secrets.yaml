# ACR pull secret 注入到 platform / train / infer 三个 namespace
# [Ref: 03_原子目标与规约/共享平台基础/stages/stage_1_启动期/step_03 §1 P2]
# 使用方式：helm install ... --set acrPullSecret.dockerconfigjson=<base64>
# 或 helm install ... -f acr-values.yaml（内含 dockerconfigjson）
{{- if .Values.acrPullSecret.dockerconfigjson }}
{{- range .Values.acrPullSecret.copyToNamespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.acrPullSecret.name }}
  namespace: {{ . }}
  labels:
    {{- include "diting-platform-base.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.acrPullSecret.dockerconfigjson }}
{{- end }}
{{- end }}
