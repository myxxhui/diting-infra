# NVIDIA RuntimeClass（GPU 推理 Pod 使用）
# [Ref: 03_原子目标与规约/共享平台基础/stages/stage_1_启动期/step_03 §1 P3]
{{- if .Values.nvidiaRuntimeClass.enabled }}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.nvidiaRuntimeClass.name }}
  labels:
    {{- include "diting-platform-base.labels" . | nindent 4 }}
handler: nvidia
{{- end }}
