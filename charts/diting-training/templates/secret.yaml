{{/* 训练凭证 Secret（HF_TOKEN / WANDB_API_KEY）· 仅在 values 里有值时创建 */}}
{{- if or .Values.secrets.hfToken .Values.secrets.wandbApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  {{- if .Values.secrets.hfToken }}
  hf-token: {{ .Values.secrets.hfToken | b64enc }}
  {{- end }}
  {{- if .Values.secrets.wandbApiKey }}
  wandb-api-key: {{ .Values.secrets.wandbApiKey | b64enc }}
  {{- end }}
{{- end }}
