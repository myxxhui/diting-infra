# diting-vllm values · P-step_05
# [Ref: 03_原子目标与规约/共享平台基础/stages/stage_1_启动期/steps/step_05_GPU推理组按需Up.md]

vllm:
  # 与训练 sanity 一致的 base 模型（NAS 本地路径）
  baseModelPath: /mnt/titan-data/models/Qwen2.5-1.5B-Instruct
  loraAdapterPaths:
    cryo: /mnt/titan-data/diting-src/output/cryo_lora_v1
    thrust: /mnt/titan-data/diting-src/output/thrust_lora_v1
    narrative: /mnt/titan-data/diting-src/output/narrative_lora_v1
  maxModelLen: 4096
  gpuMemoryUtilization: 0.85
  # T4 (compute 7.5) 须 float16；A10/A100 可用 bfloat16
  dtype: half
  enableLora: true
  maxLoras: 4

image:
  repository: vllm/vllm-openai
  tag: v0.6.6
  # infer 无公网时用 Never + base 预导入；有网时可改 IfNotPresent
  pullPolicy: IfNotPresent

imagePullSecrets: []

nodeSelector:
  stack.diting/node: infer
  nvidia.com/gpu: present

tolerations:
  - key: stack.diting/node
    operator: Equal
    value: infer
    effect: NoSchedule

resources:
  limits:
    nvidia.com/gpu: 1
    memory: 14Gi
  requests:
    nvidia.com/gpu: 1
    memory: 10Gi

service:
  type: ClusterIP
  port: 8000

replicas: 1
