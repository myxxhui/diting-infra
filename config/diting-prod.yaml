# ==============================================================================
# 生产环境（diting prod）部署配置
# ==============================================================================
# make deploy diting prod / make down diting prod 由此文件驱动。
# diting-stack：仅创建静态 PV/PVC（数据继承）；数据库使用官方 Bitnami Chart 部署。
# ==============================================================================

global:
  project_name: "diting"
  k3s:
    apiServer:
      domain: "k3s-diting-prod.example.com"

# deploy-engine 用：不在此处部署数据库，由 deploy-stack.sh 用官方 Chart 部署
# 新加坡 Anthropic 出口代理（香港 ECS 403 时 · deploy-engine env=sg-proxy）
anthropic_proxy:
  enabled: true
  deploy_engine_env: sg-proxy
  stack_id: proxy
  port: 3128
  user: ditingproxy

deploy_control:
  enable_timescaledb: true
  enable_postgres_l2: true
  enable_redis: true
  k3s_storage_plugin: "local-path"
  timescaledb_storage:
    size: "50Gi"
    storage_class: "local-path"
  postgres_l2_storage:
    size: "20Gi"
    storage_class: "local-path"
  # prod 实际由 stack.storage.redis 静态 PV + redis-values-prod.yaml existingClaim 绑定
  redis_storage:
    size: "10Gi"
    storage_class: ""

# Diting Stack：1) 静态存储 Chart  2) 数据库由脚本用官方 Chart 部署
stack:
  enabled: true
  chart_path: "charts/diting-stack"
  release_name: "diting-stack"
  namespace: "platform"

  # 仅静态 PV/PVC + 初始化 Job（与 diting-stack Chart values 同构）
  storage:
    dataPath: /mnt/titan-data/postgres
    timescaledb:
      enabled: true
      pv:
        name: timescaledb-data-pv
        capacity: 50Gi
        subPath: timescaledb
        reclaimPolicy: Retain
      pvc:
        name: data-timescaledb-postgresql-0
        namespace: platform
        accessMode: ReadWriteOnce
        storageRequest: 50Gi
    postgresL2:
      enabled: true
      pv:
        name: postgresql-l2-data-pv
        capacity: 20Gi
        subPath: postgresql-l2
        reclaimPolicy: Retain
      pvc:
        name: data-postgresql-l2-0
        namespace: platform
        accessMode: ReadWriteOnce
        storageRequest: 20Gi
    # 雷达 T0 文件缓存 · ESSD 数据盘 hostPath（与 L1/L2 同盘，ECS 复挂不丢）
    radarT0Cache:
      enabled: true
      pv:
        name: diting-radar-t0-cache-pv
        capacity: 20Gi
        subPath: radar_t0_cache
        reclaimPolicy: Retain
      pvc:
        name: diting-radar-t0-cache
        namespace: platform
        accessMode: ReadWriteOnce
        storageRequest: 20Gi
    # Redis · 静态 PV Retain（禁止 local-path，否则 make down/up 丢会话/队列缓存）
    redis:
      enabled: true
      pv:
        name: diting-redis-data-pv
        capacity: 10Gi
        subPath: redis
        reclaimPolicy: Retain
      pvc:
        name: data-redis-master-0
        namespace: platform
        accessMode: ReadWriteOnce
        storageRequest: 10Gi
    # Copilot 月报 /data/reports · 同盘子路径 Retain
    copilotReports:
      enabled: true
      pv:
        name: diting-copilot-reports-pv
        capacity: 10Gi
        subPath: copilot_reports
        reclaimPolicy: Retain
      pvc:
        name: diting-copilot-reports
        namespace: platform
        accessMode: ReadWriteOnce
        storageRequest: 10Gi

  # 采集 Job（云原生）：集群内跑 diting-ingest 镜像，启用后不再依赖 REPO_I_ROOT
  # 详见 docs/ingest-cloud-native.md；镜像来自项目 ACR，本地构建后 make push-images 推送。
  # 若用 tag: latest 仍看到旧行为：节点可能缓存了 digest；可改为唯一 tag（如日期或 git sha），构建时打同一 tag 并 push，再 deploy。
  # 后半部分实践：enabled=true 时部署/升级会创建 Job 执行 make ingest-deploy（检查后全量/增量）
  ingest:
    enabled: false
    image:
      repository: crpi-7vifw4ok9jkcxr60.cn-hongkong.personal.cr.aliyuncs.com/titan-core/diting-ingest
      tag: latest
      pullPolicy: Always
    # 私有 ACR 拉取凭证：部署前执行 kubectl apply -f charts/diting-stack/manifests/acr-pull-secret.yaml 或 make apply-acr-pull-secret
    imagePullSecrets: ["acr-titan"]
    # 密码与下面 databases 一致，或改为从 Secret 引用
    timescaleUser: "postgres"
    timescalePassword: "postgres"
    postgresL2User: "postgres"
    postgresL2Password: "postgres"
    # 数据源与 JQData：与本地 .env 一致，Pod 内无 .env 需由此注入才能采数
    ingestSource: jqdata
    jqdataDateStart: "2025-01-01"
    jqdataDateEnd: "2025-08-01"
    jqdataUser: "13031539952"
    jqdataPassword: "Hui123123"

  # 建表（Schema Init）：由 Chart 内 Job 执行 L1/L2 建表，与 ingest 同源连接；显式开启避免合并时被覆盖
  schemaInit:
    enabled: true

  # 语义分类器-A（Module A）：部署名 diting-semantic-classifier-a；连接 L1/L2 与 ingest 同源，由 Secret 注入；指定标的由 ConfigMap 挂载
  # 使用生产数据（非 Mock）必须：(1) 若 L1/L2 在集群外，在此覆盖 timescaleHost、postgresL2Host 等指向生产库；(2) chart config/diting_symbols.txt 中已有标的列表（需与 diting-src 一致时可执行 make sync-semantic-classifier-a-symbols）
  # 生产启用时需先构建并推送镜像（diting-src: make build-module-a / push-module-a），并配置 imagePullSecrets
  module_a:
    enabled: true
    image:
      repository: crpi-7vifw4ok9jkcxr60.cn-hongkong.personal.cr.aliyuncs.com/titan-core/diting-module-a
      tag: latest
      pullPolicy: Always
    imagePullSecrets: ["acr-titan"]
    timescaleUser: "postgres"
    timescalePassword: "postgres"
    postgresL2User: "postgres"
    postgresL2Password: "postgres"
    runLoop: true
    runLoopIntervalSec: 86400

  # Copilot 副驾驶 Web：NodePort 暴露前端监控（持仓体检 /health-dashboard、单股 /health-detail/601138）
  copilot:
    enabled: true
    image:
      repository: crpi-7vifw4ok9jkcxr60.cn-hongkong.personal.cr.aliyuncs.com/titan-core/diting-copilot
      # 由 make copilot-pg-deploy 写入 git sha；:latest 同步推送
      tag: e1a49500
      pullPolicy: Always
    # Copilot 业务库：PostgreSQL（postgresql-l2 实例 · ESSD 数据盘 hostPath · ECS 复挂同盘不丢库）
    postgres:
      enabled: true
      host: postgresql-l2.platform.svc.cluster.local
      port: 5432
      user: postgres
      password: postgres
      database: diting_copilot
    persistence:
      enabled: false
    imagePullSecrets: ["acr-titan"]
    redisHost: "redis-master.platform.svc.cluster.local"
    redisPort: "6379"
    redisDb: "0"
    # 行情雷达模式 C 深度研报：T2 Opus 开关 + 模型；anthropicApiKey 由
    # copilot-sync-ai-from-src-env.sh 从 diting-src/.env 注入（密钥不入库）
    ai:
      radarT2Enabled: "true"
      lighthouseModel: "claude-opus-4-8"
      anthropicModel: "claude-opus-4-8"
      anthropicBaseUrl: "https://api.anthropic.com"
      # deepseekApiKey / radarT1Mode 由 copilot-sync-ai-from-src-env.sh 从 diting-src/.env 注入
      radarT1Mode: "auto"
    radarT0CacheDir: "/data/radar_t0_cache"
    # 波次四：文件缓存 24h · DB 30 天 · 7 版/标的 · 候选区近 7 日
    radarT0CacheMaxAgeHours: "24"
    radarT0RetentionDays: "1"
    radarFileRetentionHours: "24"
    radarDbRetentionDays: "30"
    radarDbMaxVersions: "7"
    radarRecentAnalysisDays: "7"
    radarChatDefaultModel: "claude-opus-4-6"
    radarT0LiveFallback: "true"
    service:
      type: NodePort
      nodePort: 30080
    holdingsYaml: |
      holdings:
        - symbol: "601138"
          name: "工业富联"
          active: true
          role: portfolio
          quantity: 0
          cost_price: 0
          opened_at: "2024-01-01"
          segment: "科技"
          notes: "K3s Helm 部署 SoT；请在本地 my_holdings.yaml 维护真实股数成本后同步"
      defaults:
        crawl_years: [2022, 2023, 2024, 2025]
        throttle_sec: 0.6

  # 数据库部署参数（供脚本调用 bitnami/postgresql、bitnami/redis 使用）
  # 服务暴露方式由此处与 Chart 控制，Makefile 仅从本配置读取并传递 helm，不写死（见系统规则「部署内容由配置与 Chart 控制」）
  databases:
    timescaledb:
      enabled: true
      auth:
        username: postgres
        password: postgres
        database: postgres
      persistence:
        existing_claim: "data-timescaledb-postgresql-0"
      # 本机/CI 验证需从集群外连时设 NodePort 并指定 nodePort；仅集群内访问可设 ClusterIP 或不设
      service:
        type: NodePort
        nodePort: 30001
    postgres_l2:
      enabled: true
      auth:
        username: postgres
        password: postgres
        database: diting_l2
      persistence:
        existing_claim: "data-postgresql-l2-0"
      service:
        type: NodePort
        nodePort: 30002
    # Redis 部署与暴露由 config/redis-values-prod.yaml 覆盖 Bitnami Chart，Makefile 仅 -f 该文件
    redis:
      enabled: true

# 后半部分：Up 后是否执行数据采集（K3s Job 走 diting-stack/templates/ingest，非 charts/ingest）
data_ingestion:
  enabled: true
  use_k3s_job: true
  target: "ingest-test"
  core_repo_path: ""
  # 可选覆盖镜像；默认用 stack.ingest.image（ACR）
  # image: "crpi-xxx/titan-core/diting-ingest:latest"
