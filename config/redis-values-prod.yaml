# ==============================================================================
# Redis Chart 部署覆盖（prod）
# ==============================================================================
# Master 绑定 diting-stack 预创建的静态 PVC data-redis-master-0（ESSD hostPath Retain）。
# 禁止 local-path：常规 make down/up 复挂数据盘时 local-path 卷会随节点重建丢失。
# Bitnami Chart：master.service.nodePorts.redis 须为 string；replica 关闭以免额外动态卷。
# ==============================================================================

auth:
  enabled: false

master:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    existingClaim: data-redis-master-0
  service:
    type: NodePort
    nodePorts:
      redis: "30379"

replica:
  replicaCount: 0

volumePermissions:
  enabled: true
